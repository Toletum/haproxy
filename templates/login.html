<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IONS Login</title>
    <style>
        /* Usamos espacios o dobles llaves si el CSS fuera dinámico,
           pero aquí Jinja lo tratará como texto plano sin problemas */
        body { background: #121212; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: #1e1e1e; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 320px; border: 1px solid #333; }
        h2 { margin: 0 0 1.5rem; font-weight: 400; text-align: center; color: #03dac6; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; border-radius: 6px; background: #252525; color: white; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #03dac6; }
        button { width: 100%; padding: 12px; margin-top: 1rem; border: none; border-radius: 6px; background: #03dac6; color: #121212; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: #01b0a1; transform: translateY(-1px); }
        .error-msg { color: #cf6679; background: rgba(207, 102, 121, 0.1); padding: 10px; border-radius: 4px; text-align: center; margin-bottom: 1rem; font-size: 0.9rem; border: 1px solid #cf6679; }
        .info-ip {
                    text-align: left;
                    margin-top: 1.2rem;
                    font-size: 0.75rem;
                    color: #333;
                    letter-spacing: 0.5px;
                }
    </style>
</head>
<body>
    <form method="post" action="/auth/login">
        <h2>{{ host }}</h2>

        {# Lógica de Jinja2 para el error #}
        {% if error %}
            <div class="error-msg">User/Password wrong</div>
        {% endif %}

        <input type="hidden" name="next" value="{{ next }}">

        <input type="text" name="username" placeholder="User" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div class="info-ip">{{ x_real_ip }}</div>
    </form>
</body>
</html>
