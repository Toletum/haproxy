global
    lua-load /etc/haproxy/auth.lua

resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries       3
    timeout retry         1s
    hold other           30s
    hold refused         30s
    hold nx              30s
    hold valid           10s

defaults
    mode http
    timeout client  30s
    timeout connect 5s
    timeout server  30s

frontend gateway
    bind *:80
    mode http

    # 1. Routing ACLs based on Host and Path
    acl is_auth_path path_beg /auth/
    acl es_host1    hdr(host) -i host1
    acl es_host2    hdr(host) -i host2

    # Set global X-Host header for all requests
    option forwardfor
    http-request set-header X-Host %[hdr(host)]
    http-request set-header X-Real-IP %[src]

    # 2. Direct traffic to specific backends
    use_backend auth_service_be if is_auth_path
    use_backend mi_app_backend    if es_host1
    use_backend mi_app2_backend   if es_host2

    # Fallback to App 2
    default_backend mi_app2_backend

# --- Backends Configuration ---

backend auth_service_be
    mode http
    # Authentication service (Login/Verify)
    server s1 mi_auth_service:5000 check

backend mi_app_backend
    mode http

    # 3. AUTHENTICATION REQUIRED for App 1
    # Execute Lua session validation
    http-request lua.api_auth

    # Redirect to login if session is invalid
    # We include the full URL in the referer for cross-host return
    http-request redirect location /auth/login?referer=http://%[hdr(host)]%[path] if !{ var(txn.authenticated) -m bool }

    # 4. IDENTITY PROPAGATION
    # Remove client header and set the verified user from Lua
    http-request del-header X-User
    http-request set-header X-User %[var(txn.user)] if { var(txn.user) -m found }

    server s1 ui_redis:5540 check

backend mi_app2_backend
    mode http
    # 5. NO AUTHENTICATION for App 2
    # This backend is public and ignores the Lua auth script

    # Optional: Clean X-User anyway to prevent clients from spoofing user identity
    http-request del-header X-User

    server s2 mi_app_backend:8080 check
