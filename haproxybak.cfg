global
    lua-load /etc/haproxy/auth.lua

resolvers docker_resolver
    nameserver dns1 127.0.0.11:53
    resolve_retries       3
    timeout retry         1s
    hold other           30s
    hold refused         30s
    hold nx              30s
    hold valid           10s

defaults
    mode http
    timeout client  30s
    timeout connect 5s
    timeout server  30s

frontend gateway
    bind *:80
    mode http

    # 1. ACL definitions for routing and authentication bypass
    acl is_auth_path path_beg /auth/
    acl es_host1    hdr(host) -i host1
    acl es_host2    hdr(host) -i host2

    # Standardize the Host header for all backends
    http-request set-header X-Host %[hdr(host)]

    # 2. GLOBAL AUTHENTICATION: Execute Lua script for all requests
    # Exclude the authentication service path to avoid infinite loops
    http-request lua.api_auth if !is_auth_path

    # 3. REDIRECT: If user is not authenticated and not accessing the auth path
    # We pass the full URL (host + path) in the 'referer' parameter for a precise return
    http-request redirect location /auth/login?referer=%[path] if !is_auth_path !{ var(txn.authenticated) -m bool }

    # 4. IDENTITY INJECTION: Securely pass the username to backends
    # First, delete any client-provided X-User header to prevent spoofing
    http-request del-header X-User
    # Set the header only if the Lua script successfully identified the user
    http-request set-header X-User %[var(txn.user)] if { var(txn.user) -m found }

    # 5. BACKEND SELECTION: Route traffic based on Host or Path
    use_backend auth_service_be if is_auth_path
    use_backend mi_app_backend    if es_host1
    use_backend mi_app2_backend   if es_host2

    # Catch-all backend
    default_backend mi_app2_backend

# --- Backends Configuration ---

backend auth_service_be
    mode http
    server s1 mi_auth_service:5000 check

backend mi_app_backend
    mode http
    server s1 mi_app_backend:8080 check

backend mi_app2_backend
    mode http
    server s2 mi_app2_backend:5678 check
