server {
    listen 80;

    # 1. Tu App Backend (Protegida)
    location / {
        auth_request /auth-verify;

        # Si el auth falla (401), Nginx redirige a la página de login
        error_page 401 = @redireccion_login;

        auth_request_set $user $upstream_http_x_user;
        proxy_set_header X-Remote-User $user;
        proxy_pass http://mi_app_backend:8080;
    }

    # 2. El verificador interno
    location = /auth-verify {
        internal;
        proxy_pass http://mi_auth_service:5000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Pasamos la cookie al microservicio para verificarla
        proxy_set_header Cookie $http_cookie;
    }

    # 3. La página de login (FastAPI sirve el HTML)
    location /login {
        proxy_pass http://mi_auth_service:5000/login;
    }

    # Manejo de la redirección
    location @redireccion_login {
        return 302 /login;
    }
}
