services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mi_auth_service
      - mi_app_backend

  mi_auth_service:
    image: python:alpine
    container_name: mi_auth_service
    volumes:
      - jcs:/app
    working_dir: /app
    command: >
      /app/venv/bin/python main.py
    depends_on:
      - mi_redis

  mi_redis:
    image: redis:alpine
    container_name: mi_redis
    ports:
      - "6379:6379"
    command: redis-server --protected-mode no
    volumes:
      - redis_data:/data

  mi_app_backend:
    image: mendhak/http-https-echo
    container_name: mi_app_backend

volumes:
  jcs:
    external: true # Cambia a false si quieres que Docker lo cree automáticamente
  redis_data:
